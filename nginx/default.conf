map $http_x_forwarded_proto $relax_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 24m;
    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /index.html =404; }
    location ~ ^/(styles\.css|app\.js|robots\.txt|sitemap\.xml)$ { try_files $uri =404; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /static/ { alias /static/; expires 7d; }
    location /media/ { alias /media/; expires 7d; }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relax_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relax_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
